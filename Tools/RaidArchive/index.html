<!doctype html>
<html lang="en"
  ><meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>COMET · Raid Observatory</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b111b;
      --panel: #131e2e;
      --line: #29384b;
      --muted: #9cacc0;
      --ink: #eef3fa;
      --accent: #73e0cb;
      --amber: #ffc078;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font:
        15px/1.5 system-ui,
        sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    button,
    input,
    select {
      font: inherit;
    }
    button,
    a.btn {
      cursor: pointer;
      background: #223247;
      border: 1px solid #40546d;
      border-radius: 7px;
      color: var(--ink);
      padding: 8px 13px;
      text-decoration: none;
    }
    button:hover,
    a.btn:hover {
      border-color: var(--accent);
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    a {
      color: var(--accent);
    }
    header {
      padding: 22px 30px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 18px;
      align-items: center;
    }
    header strong {
      letter-spacing: 0.13em;
      font-size: 19px;
    }
    header small {
      display: block;
      color: var(--muted);
      letter-spacing: 0;
    }
    #status {
      margin-left: auto;
      color: var(--accent);
      font-size: 13px;
    }
    main {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 90vh;
    }
    aside {
      padding: 24px 16px;
      border-right: 1px solid var(--line);
    }
    article {
      padding: 28px 34px;
      min-width: 0;
      max-width: 1600px;
    }
    h1 {
      font-size: 29px;
      margin: 0 0 5px;
    }
    h2 {
      font-size: 20px;
      margin: 28px 0 12px;
    }
    h3 {
      font-size: 16px;
    }
    .muted,
    small {
      color: var(--muted);
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .space {
      justify-content: space-between;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 24px 0;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
    }
    .card b {
      display: block;
      font-size: 29px;
      color: var(--accent);
    }
    .card small {
      font-size: 13px;
    }
    .notice {
      padding: 13px 16px;
      border-left: 3px solid var(--amber);
      background: #29251f;
      margin: 18px 0;
      border-radius: 0 7px 7px 0;
    }
    .info {
      border-color: var(--accent);
      background: #142d31;
    }
    .rail {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      margin-bottom: 7px;
      background: transparent;
      font-size: 13px;
    }
    .rail.selected {
      background: var(--panel);
      border-color: var(--accent);
    }
    .rail b {
      display: block;
    }
    .rail small {
      display: block;
    }
    .pill {
      font-size: 12px;
      background: #203b36;
      color: #99e5cb;
      padding: 3px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .pill.warn {
      background: #463520;
      color: #ffd094;
    }
    .pill.dim {
      background: #283141;
      color: #adb9c9;
    }
    input,
    select {
      background: #0d1623;
      color: var(--ink);
      border: 1px solid #40546d;
      border-radius: 7px;
      padding: 9px;
      min-width: 0;
    }
    input[type="search"] {
      flex: 1;
      min-width: 180px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      background: #111c2a;
      position: sticky;
      top: 0;
    }
    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    tr.click {
      cursor: pointer;
    }
    tr.click:hover {
      background: #162537;
    }
    td.num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .scroll {
      overflow: auto;
      max-height: 640px;
      border: 1px solid var(--line);
      border-radius: 9px;
      margin-top: 14px;
    }
    .bar {
      background: #223244;
      height: 6px;
      border-radius: 3px;
      min-width: 50px;
      margin-top: 5px;
    }
    .bar i {
      display: block;
      background: var(--accent);
      height: 6px;
      border-radius: 3px;
    }
    .tabs {
      margin: 22px 0;
    }
    .tabs button.active {
      background: #24504d;
      border-color: var(--accent);
    }
    .empty {
      padding: 38px;
      text-align: center;
      color: var(--muted);
    }
    pre {
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      background: #09111c;
      padding: 16px;
      border-radius: 8px;
      max-height: 580px;
      overflow: auto;
    }
    dialog {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid #53647b;
      border-radius: 12px;
      width: min(1100px, 94vw);
      max-height: 90vh;
      padding: 24px;
    }
    dialog::backdrop {
      background: #000a;
    }
    .close {
      float: right;
    }
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .alert {
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #635133;
      background: #29261e;
      border-radius: 8px;
      cursor: pointer;
    }
    .label {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    footer {
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .source {
      font: 12px monospace;
      word-break: break-all;
    }
    @media (max-width: 1000px) {
      main {
        grid-template-columns: 210px 1fr;
      }
      article {
        padding: 20px;
      }
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 720px) {
      main {
        display: block;
      }
      aside {
        max-height: 230px;
        overflow: auto;
        border-bottom: 1px solid var(--line);
      }
      header {
        padding: 15px;
      }
      .details-grid {
        grid-template-columns: 1fr;
      }
      article {
        padding: 15px;
      }
    }
  </style>
  <header
    ><div
      ><strong
        >COMET <span style="color: var(--accent)">/</span> RAID
        OBSERVATORY</strong
      ><small>Your raids. Recorded evidence. A clearer picture.</small></div
    ><span id="status">Connecting...</span></header
  >
  <div
    id="collection"
    class="notice info"
    style="margin: 12px 30px"
    hidden
  ></div>
  <main
    ><aside
      ><button id="home" class="rail selected"
        ><b>All raids</b><small>Coverage and build history</small></button
      ><div class="row"
        ><input
          id="raidsearch"
          type="search"
          placeholder="Find a raid or map" /></div
      ><div id="raids" style="margin-top: 16px"></div></aside
    ><article id="content"
      ><div class="empty">Loading your archive...</div></article
    ></main
  >
  <dialog id="modal"
    ><button class="close" onclick="this.closest('dialog').close()"
      >Close</button
    ><div id="detail"></div
  ></dialog>
  <script src="/evidence-view.js"></script>
  <script>
    const $ = (s) => document.querySelector(s),
      esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        ),
      num = (x) => (x ?? 0).toLocaleString(),
      api = async (p) => {
        let r = await fetch(p);
        if (!r.ok) throw Error(await r.text());
        return r.json();
      };
    let filters = {},
      overview = null,
      current = null,
      selected = null,
      tab = "coverage",
      offset = 0,
      eventFeature = "",
      eventProfile = "",
      eventSearch = "",
      status = {},
      eventsData = [];
    const pill = (text, cls = "") =>
      `<span class="pill ${cls}">${esc(text)}</span>`;
    const clock = (x) =>
      x == null
        ? "-"
        : Math.floor(x / 60) +
          ":" +
          String(Math.floor(x % 60)).padStart(2, "0");
    const stateLabel = (x) =>
      ({
        "identified-attempts": "Attempts identified",
        "events-only": "Events only",
        "no-evidence": "Not observed",
        disabled: "Disabled",
        excluded: "Out of scope",
        deferred: "Deferred",
        integrated: "Covered elsewhere",
        interface: "UI / integration",
      })[x] || x;
    const featureName = (f) =>
      overview?.features.find((x) => x.id === f)?.name || f;
    async function refresh() {
      overview = await api("/api/overview?" + new URLSearchParams(filters));
      renderRail();
      if (!selected) renderOverview();
    }
    function renderRail() {
      const q = $("#raidsearch").value.toLowerCase();
      $("#raids").innerHTML = overview.raids
        .filter((r) => `${r.map} ${r.time}`.toLowerCase().includes(q))
        .map(
          (r) =>
            `<button class="rail ${selected === r.id ? "selected" : ""}" data-raid="${esc(r.id)}">` +
            `<b>${esc(r.map || "Unknown map")}</b>` +
            `<small>${esc(r.time?.replace("T", " ").slice(0, 19))}</small>` +
            `<small>${num(r.events)} events · ${r.recording === "no-comet-evidence" ? "RR archive" : r.partial ? "Partial evidence" : "Closed journal"}</small></button>`,
        )
        .join("");
      $("#home").classList.toggle("selected", !selected);
      document
        .querySelectorAll("[data-raid]")
        .forEach((b) => (b.onclick = () => openRaid(b.dataset.raid)));
    }
    const cards = (items) =>
      `<div class="cards">${items.map(([n, t]) => `<div class="card"><b>${num(n)}</b><small>${esc(t)}</small></div>`).join("")}</div>`;
    function renderOverview() {
      current = null;
      const fs = overview.features,
        rs = overview.raids;
      $("#content").innerHTML =
        `<div class="row space">` +
        `<div>` +
        `<div class="label">Archive overview</div>` +
        `<h1>Every raid adds evidence.</h1>` +
        `<div class="muted">Automatic collection after the raid. Originals stay available for re-analysis.</div>` +
        `</div>` +
        `<button id="compare">Compare raids</button>` +
        `</div>${cards([
          [overview.recordedRaids, "COMET raids with actors"],
          [
            fs.filter((f) => f.status === "runtime" && f.events).length,
            "Runtime features with evidence",
          ],
          [overview.totalEvents, "Recorded events"],
          [
            rs.filter((r) => r.recording === "partial").length,
            "Raids with incomplete evidence",
          ],
        ])}` +
        `<div class="row">${["map", "build", "configHash"]
          .map(
            (k) =>
              `<label>${{ map: "Map", build: "Build", configHash: "Configuration" }[k]} <select data-filter="${k}">` +
              `<option value="">All</option>${(overview.filterOptions?.[k] || []).map((v) => `<option value="${esc(v)}" ${filters[k] === v ? "selected" : ""}>${esc(k === "map" ? v : v.slice(0, 16))}</option>`).join("")}</select></label>`,
          )
          .join("")}` +
        `</div>` +
        `<div class="notice info">${overview.archiveEntries} archive entries preserved, including RR-only raids, menu sessions and general logs. Coverage below uses COMET raids with actors. Snapshots are not separate actions; a dash means there is no reliable occurrence count.</div>` +
        `<div class="row">` +
        `<h2 style="margin-right:auto">Feature coverage</h2>` +
        `<input id="find" type="search" placeholder="Find a feature, code or family">` +
        `<select id="scope">` +
        `<option value="runtime">Runtime features</option>` +
        `<option value="all">All feature cards</option>` +
        `<option value="missing">Runtime, no evidence</option></select>` +
        `</div>` +
        `<div id="coverage">` +
        `</div>` +
        `<footer>` +
        `<button id="collect" ${status.readOnly ? "disabled" : ""}>Check for finished raids</button> <button id="reanalyze" ${status.readOnly ? "disabled" : ""}>Re-analyze archived evidence</button>` +
        `<p>Stored locally. No uploads. No changes to gameplay. Historical raids may lack recordings or positions already deleted by RR.</p>` +
        `</footer>`;
      document.querySelectorAll("[data-filter]").forEach(
        (e) =>
          (e.onchange = () => {
            filters[e.dataset.filter] = e.value;
            refresh();
          }),
      );
      $("#find").oninput = renderOverviewTable;
      $("#scope").onchange = renderOverviewTable;
      $("#collect").onclick = () => post("/api/collect");
      $("#reanalyze").onclick = () => post("/api/reanalyze");
      $("#compare").onclick = compare;
      renderOverviewTable();
    }
    function evidenceFacts(f) {
      return (
        `<div class="row">${Object.entries(f.effects || {})
          .map(([k, v]) => pill(k + ": " + num(v) + " occurrences"))
          .join("")}${
          Object.entries(f.observationFacts || {})
            .map(([k, v]) => pill(k + ": " + num(v) + " snapshots", "dim"))
            .join("") || ""
        }` + `</div>`
      );
    }
    function renderOverviewTable() {
      const q = $("#find").value.toLowerCase(),
        scope = $("#scope").value;
      const fs = overview.features.filter(
        (f) =>
          `${f.id} ${f.name}`.toLowerCase().includes(q) &&
          (scope === "all" || f.status === "runtime") &&
          (scope !== "missing" || !f.events),
      );
      $("#coverage").innerHTML =
        `<div class="scroll">` +
        `<table>` +
        `<thead>` +
        `<tr>` +
        `<th>Feature</th>` +
        `<th>Evidence</th>` +
        `<th>Raids with events</th>` +
        `<th>Starts / completions</th>` +
        `</tr>` +
        `</thead>` +
        `<tbody>${fs
          .map(
            (f) =>
              `<tr class="click" data-feature="${f.id}">` +
              `<td>` +
              `<span class="label">${f.id}</span><br>${esc(f.name)}` +
              `</td>` +
              `<td>${pill(coverageSummary(f, overview.recordedRaids), f.events ? "" : "dim")}<br>` +
              `<small>${num(f.events)} snapshots</small>${evidenceFacts(f)}` +
              `</td>` +
              `<td>${f.raids} / ${overview.recordedRaids}<br>` +
              `<small>${f.disabledRaids ? f.disabledRaids + " disabled; " : ""}${f.unknownConfigRaids ? f.unknownConfigRaids + " config unknown" : ""}${f.changedConfigRaids ? "; " + f.changedConfigRaids + " changed during raid" : ""}</small>` +
              `</td>` +
              `<td>${["started", "completed"]
                .map((k) => {
                  const n = lifecycleValue(f, k);
                  return n === null ? "-" : num(n);
                })
                .join(" / ")}` +
              `</td>` +
              `</tr>`,
          )
          .join("")}` +
        `</tbody>` +
        `</table>` +
        `</div>`;
      document
        .querySelectorAll("[data-feature]")
        .forEach((r) => (r.onclick = () => showFeature(r.dataset.feature)));
    }

    async function openRaid(id) {
      selected = id;
      const loaded = await api("/api/raid/" + encodeURIComponent(id));
      if (selected !== id) return;
      current = loaded;
      offset = 0;
      eventFeature = "";
      eventProfile = "";
      eventSearch = "";
      renderRail();
      renderRaid();
    }
    function renderRaid() {
      const r = current,
        m = r.metadata,
        p = r.report,
        rr = m.rr || {};
      $("#content").innerHTML =
        `<div class="row space">` +
        `<div>` +
        `<div class="label">Raid evidence</div>` +
        `<h1>${esc(m.map || "Unknown map")}` +
        `</h1>` +
        `<div class="muted">${esc(m.time)} · ${esc(rr.exitStatus || "Unknown result")}` +
        `</div>` +
        `</div><a class="btn" href="/api/export/${encodeURIComponent(selected)}">Export evidence ZIP</a>` +
        `</div>${cards([
          [Object.keys(p.actors || {}).length, "Recorded actors"],
          [
            Object.values(p.sources || {}).reduce((a, b) => a + b, 0),
            "Events available",
          ],
          [p.attempts, "Tracked feature occurrences"],
          [p.alerts, "Items to review"],
        ])}${p.recording === "no-comet-evidence" ? '<div class="notice info">This is an RR archive. No COMET evidence was recorded for this raid.</div>' : p.partial ? `<div class="notice">Partial evidence. ${p.footer ? `${num(p.footer.fileLimitDropped)} events omitted by the local file limit; ${num(p.footer.queueDropped)} dropped by the queue.` : "No COMET closing footer."} ${p.malformed ? num(p.malformed) + " malformed lines." : ""} ${m.missingSegments?.length ? "Missing log segments: " + esc(m.missingSegments.join(", ")) + "." : ""} ${p.unsupportedSchemas ? num(p.unsupportedSchemas) + " unsupported records." : ""} RR may contain additional events; absence is not a failure.</div>` : ""}` +
        `<div class="row">` +
        `<span class="muted">Build: ${esc((p.headers?.[0]?.assemblyMvid || "Not recorded in this older raid").slice(0, 40))}</span>${m.rrId ? `<a target="_blank" rel="noreferrer" href="${esc(status.rrUrl || "http://127.0.0.1:7829")}">Open Raid Review</a>` : ""}` +
        `</div>` +
        `<div class="row tabs">${["coverage", "review", "events", "performance", "sources"].map((t) => `<button data-tab="${t}" class="${tab === t ? "active" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}` +
        `</div>` +
        `<div id="tab">` +
        `</div>`;
      document.querySelectorAll("[data-tab]").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            renderRaid();
          }),
      );
      renderTab();
    }
    function renderTab() {
      const r = current,
        p = r.report;
      if (tab === "coverage") {
        $("#tab").innerHTML =
          `<div class="row">` +
          `<input id="featurefind" type="search" placeholder="Find a feature">` +
          `<select id="actors">` +
          `<option value="">All actors</option>${Object.entries(p.actors || {})
            .map(
              ([id, a]) =>
                `<option value="${esc(id)}">${esc(a.name)} · ${esc(a.personalities.join(", "))}</option>`,
            )
            .join("")}</select>` +
          `</div>` +
          `<div id="ftable">` +
          `</div>` +
          `<div class="notice info">Requested → accepted → observed start → reported completion are separate facts. Zero means no such evidence was recorded, not that the feature could never run.</div>`;
        $("#featurefind").oninput = renderFeatureTable;
        $("#actors").onchange = async () => {
          current.botFeatures = $("#actors").value
            ? await api(
                "/api/bot?raid=" +
                  selected +
                  "&profile=" +
                  encodeURIComponent($("#actors").value),
              )
            : null;
          renderFeatureTable();
        };
        current.botFeatures = null;
        renderFeatureTable();
      } else if (tab === "review") {
        $("#tab").innerHTML =
          `<h2>Review candidates</h2>` +
          `<p class="muted">These are evidence-based flags, not confirmed bugs. Inspect the context and interruptions.</p>${
            r.alerts.length
              ? r.alerts
                  .map(
                    (a) =>
                      `<div class="alert" data-alert="${esc(a.event_key)}">` +
                      `<b>${esc(a.feature)} · ${esc(p.actors?.[a.profile]?.name || a.profile || "Raid")}</b> <span class="muted">${clock(a.clock)}</span><br>${esc(a.message)}` +
                      `</div>`,
                  )
                  .join("")
              : '<div class="empty">No configured review rule matched. This does not certify every feature.</div>'
          }` +
          `<h2>Probability checks</h2>` +
          `<div class="scroll">` +
          `<table>` +
          `<tr>` +
          `<th>Feature / choice</th>` +
          `<th>Real draws</th>` +
          `<th>Expected selections</th>` +
          `<th>Observed</th>` +
          `</tr>${(p.draws || []).map((d) => `<tr><td>${esc(d.feature)} / ${esc(d.action)}</td><td>${d.trials}</td><td>${d.expected.toFixed(1)}</td><td>${d.observed}</td></tr>`).join("")}` +
          `</table>` +
          `</div>`;
        document.querySelectorAll("[data-alert]").forEach(
          (el) =>
            (el.onclick = async () => {
              let d = await api(
                "/api/events?raid=" +
                  selected +
                  "&event_key=" +
                  encodeURIComponent(el.dataset.alert),
              );
              showEvent(d.events[0]);
            }),
        );
      } else if (tab === "events") {
        $("#tab").innerHTML =
          `<div class="row">` +
          `<input id="evsearch" type="search" placeholder="Reason, actor or stage" value="${esc(eventSearch)}">` +
          `<select id="evfeature">` +
          `<option value="">All features</option>${r.features
            .filter((f) => f.events)
            .map(
              (f) =>
                `<option ${eventFeature === f.feature ? "selected" : ""}>${f.feature}</option>`,
            )
            .join("")}</select>` +
          `<select id="evactor">` +
          `<option value="">All actors</option>${Object.entries(p.actors || {})
            .map(
              ([id, a]) =>
                `<option value="${esc(id)}" ${id === eventProfile ? "selected" : ""}>${esc(a.name)}</option>`,
            )
            .join("")}</select>` +
          `<button id="evgo">Filter</button>` +
          `</div>` +
          `<div id="elist">` +
          `</div>`;
        $("#evgo").onclick = () => {
          eventFeature = $("#evfeature").value;
          eventProfile = $("#evactor").value;
          eventSearch = $("#evsearch").value;
          offset = 0;
          renderEvents();
        };
        renderEvents();
      } else if (tab === "performance") {
        renderPerformance();
      } else if (tab === "sources") {
        $("#tab").innerHTML =
          `<h2>Original evidence</h2>` +
          `<p class="muted">Exact raid associations and contextual files are labelled separately. Current installed DLL hashes never stand in for an old raid build.</p>` +
          `<div class="scroll">` +
          `<table>` +
          `<tr>` +
          `<th>Source</th>` +
          `<th>Association</th>` +
          `<th>Size</th>` +
          `<th>` +
          `</th>` +
          `</tr>${r.artifacts
            .map(
              (a) =>

    function renderPerformance() {
      const data = current.metadata.performance || [];

        `<h2>COMET cost and frame evidence</h2>` +

 ${

         )
         .join("")}` +
       `</table>` +
       `</div>`
     : ""
 }
 ${
   v.frames.length

       `<table>` +
       `<tr>` +
       `<th>Session time</th>` +

             `<td>${(h.frameMs || 0).toFixed(1)} ms</td>` +
             `<td>${(h.cometMs || 0).toFixed(2)} ms</td>` +
             `<td>${
               esc(
                 (h.nearbyEvents || [])
                   .map((e) => e.feature + " " + e.name)

                   .join(", "),
               ) || "Not attributed"
             }` +
             `</td>` +
             `</tr>`,

         .join("")}` +
       `</table>` +
       `</div>`
     : ""
 }` +
                    `<details>` +
                    `<summary>Raw measurement summary</summary>` +
                    `<pre>${esc(JSON.stringify(v.summaries, null, 2))}` +
                    `</pre>` +
                    `</details>` +
                    `</div>`

                })

            : '<div class="empty">No performance recording is available for this raid. Enable COMET performance capture for future measurements.</div>'
        }`;
      document.querySelectorAll("[data-hitch]").forEach(

              `<h2>Frame evidence</h2><pre>${esc(JSON.stringify(data[v].frames[h], null, 2))}</pre>`;

    function renderFeatureTable() {
      const q = $("#featurefind").value.toLowerCase(),
        fs = (current.botFeatures || current.features).filter((f) =>
          `${f.feature} ${f.name || featureName(f.feature)}`

      $("#ftable").innerHTML =
        `<div class="scroll">` +

        `<th>Feature</th>` +

              `<span class="label">${f.feature}</span><br>${esc(f.name || featureName(f.feature))}` +

                    `<td class="num">${f.coverage !== "identified-attempts" || f.counting === "draw" || (k === "completed" && ["A01", "A02"].includes(f.feature)) ? "-" : num(f[k])}` +

                .join("")}` +
              `</tr>`,
          )
          .join("")}` +

      document

    async function showFeature(f) {
      if (!current) {
        let ids = overview.features.find((x) => x.id === f)?.raidIds || [];
        let raids = overview.raids.filter((r) => ids.includes(r.id));
        $("#detail").innerHTML =
          `<h2>${esc(f)} · ${esc(featureName(f))}` +
          `</h2>` +
          `<p>${esc(overview.features.find((x) => x.id === f)?.evidenceNote)}` +
          `</p>` +
          `<p>${esc(coverageSummary(overview.features.find((x) => x.id === f) || {}, overview.recordedRaids))}. Select a raid to inspect the actor-level evidence.</p>${raids.length ? "" : '<div class="empty">No events for this feature in the selected raids. Check its prerequisites and recorded configuration; this is not a failure count.</div>'}${raids.map((r) => `<button class="rail" data-open="${r.id}"><b>${esc(r.map)}</b>${esc(r.time)}</button>`).join("")}`;
        $("#modal").showModal();
        document.querySelectorAll("[data-open]").forEach(
          (b) =>
            (b.onclick = () => {
              $("#modal").close();
              openRaid(b.dataset.open);
            }),
        );
        return;
      }
      const m =
        (current.botFeatures || current.features).find(
          (x) => x.feature === f,
        ) || {};
      $("#detail").innerHTML =
        `<h2>${esc(f)} · ${esc(featureName(f))}` +
        `</h2>` +
        `<p>${pill(coverageSummary(m), "dim")} · ${num(m.events)} recorded events</p>` +
        `<p>${esc(m.evidenceNote)}` +
        `</p>${evidenceFacts(m)}` +
        `<div class="details-grid">` +
        `<div>` +
        `<h3>Recorded reasons</h3>${
          Object.entries(m.reasons || {})
            .map(([k, v]) => `<p>${esc(k)} <b>${num(v)}</b></p>`)
            .join("") || "<p>No evidence.</p>"
        }` +
        `</div>` +
        `<div>` +
        `<h3>Recorded states</h3>${Object.entries(m.states || {})
          .map(([k, v]) => `<p>${esc(k)} <b>${num(v)}</b></p>`)
          .join("")}` +
        `</div>` +
        `</div>` +
        `<div class="notice">${num(m.unknownIdentityEvents)} events lack an occurrence identity. They are counted as observations, not distinct attempts. Completion is feature-reported and does not prove tactical success.</div>` +
        `<h3>Observations without an occurrence ID</h3>` +
        `<p class="muted">Repeated snapshots can describe the same action. These counts are not separate executions.</p>` +
        `<div class="row">${
          Object.entries(m.observationFacts || {})
            .map(([k, v]) => pill(k + ": " + num(v), "dim"))
            .join("") || "None recorded."
        }` +
        `</div>` +
        `<p>` +
        `<button id="inspect">Inspect timeline</button>` +
        `</p>`;
      $("#modal").showModal();
      $("#inspect").onclick = () => {
        $("#modal").close();
        eventFeature = f;
        eventProfile = $("#actors")?.value || "";
        tab = "events";
        offset = 0;
        renderRaid();
      };
    }
    async function renderEvents() {
      let q = new URLSearchParams({
        raid: selected,
        feature: eventFeature,
        profile: eventProfile,
        search: eventSearch,
        offset,
        limit: 50,
      });
      const d = await api("/api/events?" + q);
      if (tab !== "events" || !$("#elist") || q.get("raid") !== selected)
        return;
      eventsData = d.events;
      $("#elist").innerHTML =
        `<p class="muted">${num(d.total)} events · clocks are game-session seconds; RR time is shown when recorded.</p>` +
        `<div class="scroll">` +
        `<table>` +
        `<tr>` +
        `<th>Time</th>` +
        `<th>Actor</th>` +
        `<th>Feature / action</th>` +
        `<th>Stage</th>` +
        `<th>Reason</th>` +
        `</tr>${d.events
          .map(
            (e, i) =>
              `<tr class="click" data-event="${i}">` +
              `<td>${clock(e.detail._rrTimeMs == null ? e.clock : e.detail._rrTimeMs / 1000)}<br>` +
              `<small>${e.detail._rrTimeMs == null ? "Session" : "Raid"}</small>` +
              `</td>` +
              `<td>${esc(e.name || "Raid")}` +
              `</td>` +
              `<td>${esc(e.feature)}<br>${esc(e.detail.decision)}` +
              `</td>` +
              `<td>${esc(e.stage)}` +
              `</td>` +
              `<td>${esc(e.reason)}` +
              `</td>` +
              `</tr>`,
          )
          .join("")}` +
        `</table>` +
        `</div>` +
        `<div class="row" style="margin-top:15px">` +
        `<button id="prev" ${offset === 0 ? "disabled" : ""}>Previous</button>` +
        `<span>${d.total ? offset + 1 : 0}-${Math.min(offset + 50, d.total)} of ${num(d.total)}</span>` +
        `<button id="next" ${offset + 50 >= d.total ? "disabled" : ""}>Next</button>` +
        `</div>`;
      $("#prev").onclick = () => {
        offset = Math.max(0, offset - 50);
        renderEvents();
      };
      $("#next").onclick = () => {
        offset += 50;
        renderEvents();
      };
      document
        .querySelectorAll("[data-event]")
        .forEach(
          (b) => (b.onclick = () => showEvent(eventsData[+b.dataset.event])),
        );
    }
    function showEvent(e) {
      if (!e) return;
      $("#detail").innerHTML =
        `<h2>${esc(e.name || "Raid")} · ${esc(e.feature)}` +
        `</h2>` +
        `<p>${esc(e.detail.decision)} · ${esc(e.stage)} · ${clock(e.clock)}` +
        `</p>` +
        `<p>${esc(e.reason)}` +
        `</p>` +
        `<p class="source">Evidence: ${esc(e.source)} · line / RR row ${e.line}` +

        `<p class="muted">RR timestamp: ${e.detail._rrTimeMs == null ? "unavailable" : clock(e.detail._rrTimeMs / 1000)}` +
        `</p>` +
        `<pre>${esc(JSON.stringify(e.detail, null, 2))}` +
        `</pre>`;
      if (!$("#modal").open) $("#modal").showModal();
    }
    function compare() {
      const opts = overview.raids
        .map(
          (r) =>
            `<option value="${r.id}">${esc(r.map)} · ${esc(r.time)}</option>`,
        )
        .join("");
      $("#detail").innerHTML =
        `<h2>Compare two raids</h2>` +

          `</tr>${Object.keys(a.features)
            .filter((f) => a.features[f].events || b.features[f]?.events)
            .map(
              (f) =>
                `<tr>` +

                `</tr>`,

    async function post(p) {
      await fetch(p, { method: "POST", headers: { "X-Raid-Local": "1" } });
      $("#status").textContent = "Work queued";
    }
    $("#home").onclick = () => {
      selected = null;
      renderRail();
      renderOverview();
    };
    $("#raidsearch").oninput = renderRail;
    async function poll() {
      try {
        status = await api("/api/status");
        $("#status").textContent =
          {
            archived: "Archived - read only",
            ready: "Collecting automatically",
            collecting: "Archiving / analyzing...",
            starting: "Starting...",
            retrying: "Retry pending",
            reanalyzing: "Re-analyzing...",
            "waiting-for-raid-end": "Waiting for raid end",
          }[status.state] || status.state;
        if (status.error) $("#status").title = status.error;
        if (status.state === "reanalyzing") window.wasReanalyzing = true;
        if (
          ["ready", "retrying"].includes(status.state) &&
          status.updated !== window.lastCollection
        ) {
          window.lastCollection = status.updated;
          const changed = status.imported > 0 || window.wasReanalyzing;
          window.wasReanalyzing = false;
          if (overview && changed) {
            const id = selected;
            await refresh();
            if (id && selected === id) {
              const loaded = await api("/api/raid/" + encodeURIComponent(id));
              if (selected === id) {
                current = loaded;
                renderRaid();
              }
            }
          }
        }
      } catch {
        $("#status").textContent = "Collector offline";
      }
    }
    async function initialize() {
      status = await api("/api/status");
      const banner = $("#collection");
      if (status.collectionLabel || status.readOnly) {
        banner.hidden = false;
        banner.textContent =
          (status.collectionLabel || "Archived collection") +
          (status.readOnly ? " - read-only snapshot." : "");
        if (status.collectAfterUtc)
          banner.append(
            document.createTextNode(
              " New raids since " +
                new Date(status.collectAfterUtc).toLocaleString() +
                ".",
            ),
          );
        if (status.archiveUrl) {
          const url = new URL(status.archiveUrl);
          if (
            url.protocol === "http:" &&
            ["127.0.0.1", "localhost"].includes(url.hostname)
          ) {
            const a = document.createElement("a");
            a.href = url.href;
            a.target = "_blank";
            a.rel = "noreferrer";
            a.textContent = "Open previous collection";
            a.style.marginLeft = "16px";
            banner.append(a);
          }
        }
      }
      await refresh();
      await poll();
      setInterval(poll, 5000);
    }
    initialize().catch((e) => ($("#content").textContent = e.message));
